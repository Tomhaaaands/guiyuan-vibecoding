name: quality

on:
  push:
  pull_request:

jobs:
  security_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage snapshot
        run: git add -A
      - name: Staged safety gate
        run: python tools/git_safety_gate.py

  qa:
    runs-on: ubuntu-latest
    needs: security_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: QA
        run: python tools/run_qa.py
